<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Win10</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; background: #041a38; }
    .stage {
      position: relative;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      font-family: "Liberation Sans", "DejaVu Sans", "Segoe UI", system-ui, sans-serif;
      color: #fff;
      background:
        radial-gradient(ellipse 70% 80% at 50% 42%, #0a4d8c 0%, transparent 58%),
        radial-gradient(ellipse 40% 36% at 50% 38%, #5ec8e8 0%, transparent 52%),
        radial-gradient(ellipse 18% 16% at 50% 36%, #e8f7ff 0%, transparent 70%),
        linear-gradient(180deg, #062445 0%, #041a38 55%, #020d1c 100%);
    }
    .vignette {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 78% 70% at 50% 42%, transparent 40%, rgba(2, 8, 20, 0.55) 100%);
      pointer-events: none;
    }
    .rays {
      position: absolute;
      left: 50%; top: 38%;
      width: 1100px; height: 1100px;
      transform: translate(-50%, -50%);
      background: repeating-conic-gradient(
        from 8deg at 50% 50%,
        rgba(232, 247, 255, 0.16) 0deg 2.2deg,
        transparent 2.2deg 18deg
      );
      mask-image: radial-gradient(circle at 50% 50%, #000 0%, transparent 58%);
      -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 0%, transparent 58%);
      opacity: 0.55;
      pointer-events: none;
    }
    .haze {
      position: absolute; inset: 0;
      background:
        radial-gradient(circle at 36% 30%, rgba(94, 200, 232, 0.18), transparent 28%),
        radial-gradient(circle at 64% 48%, rgba(0, 120, 215, 0.22), transparent 32%);
      pointer-events: none;
    }
    .lockup {
      position: absolute;
      left: 50%;
      top: 46%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 720px;
      text-align: center;
    }
    .mark {
      width: 152px;
      height: 152px;
      filter:
        drop-shadow(0 0 18px rgba(94, 200, 232, 0.85))
        drop-shadow(0 0 48px rgba(0, 120, 215, 0.7));
      margin-bottom: 22px;
    }
    .title {
      font-size: 148px;
      font-weight: 700;
      letter-spacing: 0.04em;
      line-height: 0.9;
      color: #ffffff;
      text-shadow:
        0 2px 0 rgba(4, 26, 56, 0.35),
        0 8px 28px rgba(0, 0, 0, 0.45),
        0 0 40px rgba(94, 200, 232, 0.35);
    }
    .tag {
      margin-top: 14px;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.46em;
      text-transform: uppercase;
      color: #5ec8e8;
      text-shadow: 0 0 18px rgba(94, 200, 232, 0.55);
    }
    .icons {
      position: absolute;
      left: 28px;
      top: 28px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      width: 72px;
      opacity: 0.92;
    }
    .desk-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      font-size: 11px;
      letter-spacing: 0.01em;
    }
    .desk-icon .glyph {
      width: 36px; height: 36px;
      display: grid; place-items: center;
    }
    .taskbar {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 48px;
      background: linear-gradient(180deg, #1a1a1a 0%, #101010 40%, #0a0a0a 100%);
      display: flex;
      align-items: stretch;
      box-shadow: 0 -1px 0 rgba(255,255,255,0.06);
    }
    .tb-start {
      width: 48px;
      display: grid;
      place-items: center;
      background: #0078D7;
    }
    .tb-start svg { width: 18px; height: 18px; }
    .tb-apps {
      display: flex;
      align-items: stretch;
      padding-left: 2px;
    }
    .tb-app {
      width: 48px;
      display: grid;
      place-items: center;
      border-bottom: 3px solid transparent;
    }
    .tb-app.active { border-bottom-color: #5ec8e8; background: rgba(255,255,255,0.06); }
    .tb-search {
      margin: 8px 10px;
      width: 220px;
      height: 32px;
      background: #1f1f1f;
      border: 1px solid #3a3a3a;
      color: #c8c8c8;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      font-size: 13px;
    }
    .tb-tray {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 16px 0 8px;
      color: #f3f3f3;
      font-size: 12px;
      letter-spacing: 0.01em;
    }
    .clock { text-align: right; line-height: 1.2; }
    .clock small { display: block; color: #d0d0d0; font-size: 11px; }
    .noise {
      position: absolute; inset: 0;
      opacity: 0.07;
      pointer-events: none;
      mix-blend-mode: overlay;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="rays"></div>
    <div class="haze"></div>
    <svg class="noise" xmlns="http://www.w3.org/2000/svg" width="1200" height="630">
      <filter id="n">
        <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      </filter>
      <rect width="100%" height="100%" filter="url(#n)"/>
    </svg>
    <div class="vignette"></div>

    <div class="icons">
      <div class="desk-icon">
        <div class="glyph">
          <svg viewBox="0 0 36 36" width="36" height="36">
            <rect x="4" y="8" width="28" height="20" rx="1.5" fill="#0078D7"/>
            <rect x="4" y="8" width="28" height="5" fill="#5ec8e8"/>
            <rect x="14" y="28" width="8" height="2" fill="#c8c8c8"/>
            <rect x="10" y="30" width="16" height="2" fill="#e8e8e8"/>
          </svg>
        </div>
        Este equipo
      </div>
      <div class="desk-icon">
        <div class="glyph">
          <svg viewBox="0 0 36 36" width="36" height="36">
            <rect x="8" y="10" width="20" height="18" rx="1" fill="#6b6b6b"/>
            <rect x="10" y="12" width="16" height="12" fill="#2a2a2a"/>
            <path d="M12 28h12l2 4H10z" fill="#8a8a8a"/>
          </svg>
        </div>
        Papelera
      </div>
    </div>

    <div class="lockup">
      <svg class="mark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <rect x="0" y="0" width="46" height="46" fill="#5ec8e8"/>
        <rect x="54" y="0" width="46" height="46" fill="#3db4e8"/>
        <rect x="0" y="54" width="46" height="46" fill="#0078D7"/>
        <rect x="54" y="54" width="46" height="46" fill="#0067b8"/>
      </svg>
      <div class="title">Win10</div>
      <div class="tag">Start</div>
    </div>

    <div class="taskbar">
      <div class="tb-start">
        <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
          <rect x="0" y="0" width="7" height="7" fill="#fff"/>
          <rect x="9" y="0" width="7" height="7" fill="#fff"/>
          <rect x="0" y="9" width="7" height="7" fill="#fff"/>
          <rect x="9" y="9" width="7" height="7" fill="#fff"/>
        </svg>
      </div>
      <div class="tb-search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#c8c8c8" stroke-width="2">
          <circle cx="11" cy="11" r="7"/>
          <path d="M20 20l-3.5-3.5"/>
        </svg>
        Buscar en Win10
      </div>
      <div class="tb-apps">
        <div class="tb-app active">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <rect x="3" y="5" width="18" height="13" rx="1" fill="#0078D7"/>
            <rect x="3" y="5" width="18" height="3" fill="#5ec8e8"/>
          </svg>
        </div>
        <div class="tb-app">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9" fill="#0078D7"/>
            <circle cx="12" cy="12" r="4" fill="#5ec8e8"/>
          </svg>
        </div>
      </div>
      <div class="tb-tray">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="#f3f3f3">
          <path d="M4 10c4-5 12-5 16 0" fill="none" stroke="#f3f3f3" stroke-width="2"/>
          <circle cx="12" cy="16" r="1.6"/>
        </svg>
        <svg width="16" height="12" viewBox="0 0 20 12">
          <rect x="0" y="2" width="16" height="8" rx="1" fill="none" stroke="#f3f3f3" stroke-width="1.4"/>
          <rect x="2" y="4" width="10" height="4" fill="#f3f3f3"/>
          <rect x="16.5" y="4.5" width="2" height="3" fill="#f3f3f3"/>
        </svg>
        <div class="clock">10:00 AM<small>25/08/2015</small></div>
      </div>
    </div>
  </div>
</body>
</html>
